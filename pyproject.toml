[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[project]
name = "redlink-database"
version = "0.1.0"
description = "Pipeline for building a public Wikipedia redlinks dataset and static website."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Riccardo Ruspoli", email = "riccardoruspoli@gmail.com" }
]
requires-python = ">=3.14,<3.15"
urls = { 
  Homepage = "https://redlink.riccardoruspoli.com",
  Repository = "https://github.com/riccardoruspoli/redlink-database",
  Issues = "https://github.com/riccardoruspoli/redlink-database/issues",
  Documentation = "https://github.com/riccardoruspoli/redlink-database/blob/master/README.md"
}
keywords = [
  "wikipedia",
  "wikimedia",
  "redlinks",
  "duckdb",
  "parquet",
  "static-site",
]
dependencies = [
    "beautifulsoup4",
    "duckdb",
    "jinja2",
    "natsort",
    "psutil",
    "pyarrow",
    "requests",
    "unidecode",
]

[project.optional-dependencies]
dev = [
  "ruff"
]

[project.scripts]
redlink-database = "redlink_database.__main__:main"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["E501"]
